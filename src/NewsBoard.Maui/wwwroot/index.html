<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>新闻看板</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/NewsBoard.Shared/css/app.css" />
    <style>
        /* Blazor 运行时起来之前是纯黑屏（app.css 把 body 设成黑底，默认黑字看不见），
           这里给一个看得见的启动提示；运行时一起来就移除它。 */
        #boot-hint {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #8E8E93;
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            font-size: 20px;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <div id="boot-hint">正在启动…</div>

    <div id="blazor-error-ui">
        发生了未处理的错误。
        <a href="" class="reload">重新加载</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_content/NewsBoard.Shared/js/measure.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        // MAUI 的 BlazorWebView 会自己启动 Blazor 并注册 XAML 里声明的根组件（MainPage.xaml 的
        // Selector="#app"）。这里**不能抢在框架之前**调用 Blazor.start()：抢跑会用「没有根组件」
        // 的方式把它启动起来，框架随后带根组件的启动会被拒绝（"Blazor has already started."），
        // 页面就只剩一片空白（Android 真机实测：进程活着、WebView 在、#app 为空）。
        // 所以这里只观察：框架渲染出来就撤掉启动提示；框架迟迟不启动才兜底自己启动。
        function hideBootHint() {
            var hint = document.getElementById('boot-hint');
            if (hint) { hint.remove(); }
        }

        (function watchFrameworkStart() {
            var tries = 0;
            var timer = setInterval(function () {
                var app = document.getElementById('app');
                if (app && app.childElementCount > 0) {
                    clearInterval(timer);
                    hideBootHint();
                    return;
                }
                if (++tries >= 30) {
                    clearInterval(timer);
                    try {
                        var started = Blazor.start();
                        if (started && started.then) { started.then(hideBootHint, hideBootHint); } else { hideBootHint(); }
                    } catch (e) {
                        hideBootHint();
                    }
                }
            }, 100);
        })();
    </script>
</body>

</html>
