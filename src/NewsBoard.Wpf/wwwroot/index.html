<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新闻看板</title>
    <base href="/" />
    <!-- 播放页样式由 Shared 类库提供（SA3 产出） -->
    <link rel="stylesheet" href="_content/NewsBoard.Shared/css/app.css" />
    <style>
        /* Blazor 运行时起来之前是纯黑屏（app.css 把 body 设成黑底，默认黑字看不见），
           这里给一个看得见的启动提示；运行时一起来就移除它。 */
        #boot-hint {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #8E8E93;
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            font-size: 20px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="boot-hint">正在启动…</div>
    <script src="_content/NewsBoard.Shared/js/measure.js"></script>
    <script src="_framework/blazor.webview.js"></script>
    <script>
        // 键盘焦点在 WebView2 内容里时，WPF 侧收不到按键（无边框全屏下会因此出不来），
        // 这里把 F11/Esc 转发给宿主处理。
        window.addEventListener('keydown', function (e) {
            if (e.key !== 'F11' && e.key !== 'Escape') return;
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage('hostKey:' + e.key);
                e.preventDefault();
            }
        }, true);

        // Blazor 运行时就绪即撤掉启动提示（重复调用 Blazor.start() 是幂等的）
        function hideBootHint() {
            var hint = document.getElementById('boot-hint');
            if (hint) { hint.remove(); }
        }
        try {
            var started = Blazor.start();
            if (started && started.then) { started.then(hideBootHint, hideBootHint); } else { hideBootHint(); }
        } catch (e) {
            hideBootHint();
        }
    </script>
</body>
</html>
